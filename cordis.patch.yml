# Host + client halves of the composer-prediction plugin.
#
# Host half: serves GET /plugins/dsh-composer-predict/state?session=<id> (the
# suggestion the browser polls) and listens for turn/end to generate it.
# Client half: the `conversation.input.dock` entry above the composer card,
# declared through `dsh.client` in package.json.
#
# Rollback: remove the `composer-predict` insert below (or drop the package from
# the profile's `dsh.profile.bundles`), then restart the host.
- insert:
    - id: composer-predict
      name: dsh-composer-predict
